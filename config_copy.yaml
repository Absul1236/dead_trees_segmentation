# =========================
# config.yaml (TEMPLATE)
# =========================
# Copy this file to `config.yaml` before running the program.
# Do NOT edit this template file (keep it as a baseline reference).
#
# Windows (PowerShell):
#   Copy-Item config_copy.yaml config.yaml
# Linux/macOS:
#   cp config_copy.yaml config.yaml
#
# CLI arguments override `config.yaml` values when provided.

globals:
  # IoU threshold used only for counting "good" images (IoU >= threshold)
  iou_threshold: 0.1

  # How many images to process at most (min(all_limit, number_of_files))
  all_limit: 50

paths:
  # Input folders (relative to project root)
  rgb_dir: ""
  nrg_dir: ""
  mask_dir: ""

  # Root output folder (relative to project root)
  results_dir: ""

  # Subfolders for saved output masks
  out_rgb_subdir: ""
  out_nrg_subdir: ""
  out_merge_subdir: ""

  # Subfolder where logs and the plots report are saved
  reports_subdir: ""

logging:
  # Logging level: DEBUG / INFO / WARNING / ERROR
  level: "INFO"

  # Log filename saved inside results/reports/
  filename: "run.log"

report:
  # Combined plots filename saved inside results/reports/
  # (IoU histograms + TP/FP/FN bars for NRG/RGB/MERGE)
  filename: "metrics_report.png"

mask_generation:
  nrg:
    # NRG mask thresholds after per-image normalization to [0,1]
    nir_threshold: 0.32
    r_threshold: 0.45

  rgb:
    # Hue band for purple/pink tones (wrap-around range)
    h_low: 0.74
    h_high: 0.05

    # Percentiles for adaptive thresholds computed inside the hue band
    s_q: 60
    v_q: 25

    # Minimum allowed thresholds (fallbacks)
    min_s: 0.08
    min_v: 0.08

    # Maximum value threshold
    max_v: 1.00

  merge:
    # Radius of NRG dilation used to keep RGB predictions near NRG positives
    radius: 3

  clean:
    # Morphological post-processing parameters
    min_size: 80
    hole_size: 120
    radius: 1
